spring.application.name=bazar

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bazar?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
jakarta.persistence.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/bazar?useSSL=false&serverTimezone=UTC}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
